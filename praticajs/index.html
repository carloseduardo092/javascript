<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pratica Javascript</title>
    <style>
      body {
        background-color: darkgrey;
      }
      h1 {
        color: blueviolet;
        font-family: Arial, Helvetica, sans-serif;
      }
      p {
        font-family: sans-serif;
        color: darkslateblue;
      }
    </style>
  </head>
  <body>
    <h1>Prática Javascript</h1>
    <p>Muito obrigado por interagir no Prompt!!</p>
    <script>
      var n1 = Number(window.prompt("Digite um número: ")); //string
      var n2 = Number(window.prompt("Digite outro número: ")); //conversão de string para number
      var soma = n1 + n2; //conversão de string para numero
      var resultado = window.alert(`A soma entre ${n1} + ${n2} é = ${soma}`);
    </script>
  </body>
</html>
