<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventos DOM</title>
    <style>
      div#area {
        font: normal 20pt Arial;
        background: yellow;
        color: white;
        width: 200px;
        height: 200px;
        line-height: 200px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="area">interaja...</div>

    <script>
      var a = window.document.getElementById("area");
      var timeout;
      a.addEventListener("click", mudarTexto);
      a.addEventListener("mouseenter", entrar);
      a.addEventListener("mouseout", sair);
      function mudarTexto() {
        a.innerText = "clicou";
        a.style.background = "red";
        resetDiv()
      }

      function entrar() {
        a.innerText = "Entrou";
        a.style.background = "blue";
        resetDiv()
      }

      function sair() {
        a.innerText = "Saiu";
        a.style.background = "green";
        resetDiv()
      }

      function resetDiv() {
        clearTimeout(timeout);
        timeout = setTimeout(() => {
          a.innerText = "Interaja...";
          a.style.background = "yellow";
        }, 2000);
      }
    </script>
  </body>
</html>
